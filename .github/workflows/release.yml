name: Release Extension

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Test
        run: |
          npm install --no-fund --no-audit
          npm test

      - name: Extract Version and Check Tag
        id: version_check
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          git fetch --tags

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists. Skipping release creation."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist. Proceeding with release."
          fi

      - name: Create Git Tag
        if: steps.version_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version_check.outputs.tag }}
          git push origin ${{ steps.version_check.outputs.tag }}

      - name: Package Extension
        if: steps.version_check.outputs.exists == 'false'
        run: |
          mkdir dist
          cp -r manifest.json background.js content.js rules.json settingsIntegration.js \
            features icons styles popup LICENSE README.md lib shared dist/

          cd dist
          zip -r ../YouTubeTVMode.zip *
          cd ..

          # Stable CRX only when CRX_PRIVATE_KEY secret is configured.
          # Generating a new key every release breaks update identity.
          if [ -n "${{ secrets.CRX_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.CRX_PRIVATE_KEY }}" > key.pem
            npx -y crx pack dist -p key.pem -o YouTubeTVMode.crx
            echo "crx=true" >> $GITHUB_ENV
          else
            echo "CRX_PRIVATE_KEY not set — shipping ZIP only."
            echo "crx=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release (ZIP + CRX)
        if: steps.version_check.outputs.exists == 'false' && env.crx == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          files: |
            YouTubeTVMode.zip
            YouTubeTVMode.crx
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (ZIP only)
        if: steps.version_check.outputs.exists == 'false' && env.crx != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          files: |
            YouTubeTVMode.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
