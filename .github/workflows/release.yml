name: Release Extension

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history and tags

      - name: Extract Version and Check Tag
        id: version_check
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Fetch tags to ensure we have the latest tags from remote
          git fetch --tags

          # Check if the tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists. Skipping release creation."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist. Proceeding with release."
          fi

      - name: Create Git Tag
        if: steps.version_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version_check.outputs.tag }}
          git push origin ${{ steps.version_check.outputs.tag }}

      - name: Package Extension
        if: steps.version_check.outputs.exists == 'false'
        run: |
          mkdir dist
          cp -r manifest.json background.js content.js rules.json settingsIntegration.js features icons styles popup LICENSE README.md dist/
          
          # Create ZIP
          cd dist
          zip -r ../YouTubeTVMode.zip *
          cd ..
          
          # Generate private key and create CRX
          openssl genrsa -out key.pem 2048
          npx -y crx pack dist -p key.pem -o YouTubeTVMode.crx

      - name: Create GitHub Release
        if: steps.version_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          files: |
            YouTubeTVMode.zip
            YouTubeTVMode.crx
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
